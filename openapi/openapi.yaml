openapi: 3.0.3
info:
  title: ZVideo API
  version: 1.0.0
  description: REST API for a video hosting platform.
servers:
  - url: /api/v1
security:
  - BearerAuth: []
tags:
  - name: Auth
  - name: Users
  - name: Channels
  - name: Subscriptions
  - name: Videos
  - name: Comments
  - name: Playlists
  - name: Community
paths:
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Tokens issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate refresh token and issue new tokens
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current refresh token
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Logged out.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: Delete current user account
      operationId: deleteCurrentUser
      responses:
        '204':
          description: Account deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/me/notification-settings:
    patch:
      tags: [Users]
      summary: Update current user's notification settings
      operationId: updateCurrentUserNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettingsRequest'
      responses:
        '204':
          description: Notification settings updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      tags: [Users]
      summary: List users
      description: Requires admin role.
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Users page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{userId}/ban:
    post:
      tags: [Users]
      summary: Ban a user
      description: Requires admin role.
      operationId: banUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: User banned.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}/unban:
    post:
      tags: [Users]
      summary: Unban a user
      description: Requires admin role.
      operationId: unbanUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: User unbanned.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}/role:
    put:
      tags: [Users]
      summary: Replace user role
      description: Requires admin role.
      operationId: replaceUserRole
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUserRoleRequest'
      responses:
        '204':
          description: Role changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}/channel:
    get:
      tags: [Channels]
      security: []
      summary: Get a user's channel
      operationId: getUserChannel
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User's channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '404':
          $ref: '#/components/responses/NotFound'
  /channels:
    get:
      tags: [Channels]
      security: []
      summary: List channels
      operationId: listChannels
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Channels page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelPage'
    post:
      tags: [Channels]
      summary: Create current user's channel
      operationId: createChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelCreateRequest'
      responses:
        '201':
          description: Channel created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /channels/me:
    get:
      tags: [Channels]
      summary: Get current user's channel
      operationId: getMyChannel
      responses:
        '200':
          description: Current user's channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /channels/{channelId}:
    get:
      tags: [Channels]
      security: []
      summary: Get channel by id
      operationId: getChannel
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Channels]
      summary: Update channel
      operationId: updateChannel
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelUpdateRequest'
      responses:
        '200':
          description: Channel updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Channels]
      summary: Delete channel
      operationId: deleteChannel
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204':
          description: Channel deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /channels/by-name/{name}:
    get:
      tags: [Channels]
      security: []
      summary: Get channel by name
      operationId: getChannelByName
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '404':
          $ref: '#/components/responses/NotFound'
  /channels/{channelId}/subscriptions:
    put:
      tags: [Subscriptions]
      summary: Subscribe to channel
      operationId: subscribeToChannel
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204':
          description: Subscribed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Subscriptions]
      summary: Unsubscribe from channel
      operationId: unsubscribeFromChannel
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204':
          description: Unsubscribed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /channels/{channelId}/subscriptions/status:
    get:
      tags: [Subscriptions]
      summary: Check current user's subscription to channel
      operationId: getChannelSubscriptionStatus
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Subscription status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /channels/{channelId}/subscribers/count:
    get:
      tags: [Subscriptions]
      security: []
      summary: Get channel subscribers count
      operationId: getChannelSubscribersCount
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Subscribers count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/me/subscriptions:
    get:
      tags: [Subscriptions]
      summary: List current user's subscriptions
      operationId: listMySubscriptions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Subscriptions page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/subscriptions/{channelId}/new-videos-count:
    delete:
      tags: [Subscriptions]
      summary: Reset unread new videos count for subscription
      operationId: resetSubscriptionNewVideosCount
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204':
          description: Counter reset.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /videos:
    get:
      tags: [Videos]
      security: []
      summary: List videos
      operationId: listVideos
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Videos page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoPage'
  /users/me/videos:
    get:
      tags: [Videos]
      summary: List current user's channel videos
      operationId: listMyVideos
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Videos page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /channels/{channelId}/videos:
    get:
      tags: [Videos]
      security: []
      summary: List channel videos
      operationId: listChannelVideos
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Videos page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /channels/{channelId}/videos/uploads:
    post:
      tags: [Videos]
      summary: Initialize video upload
      operationId: initVideoUpload
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoUploadInitRequest'
      responses:
        '201':
          description: Pending video and upload URL created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoUploadInitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /videos/{videoId}:
    get:
      tags: [Videos]
      security: []
      summary: Get video metadata
      operationId: getVideo
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Video.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Videos]
      summary: Update video metadata
      operationId: updateVideo
      parameters:
        - $ref: '#/components/parameters/VideoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoUpdateRequest'
      responses:
        '200':
          description: Video updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Videos]
      summary: Delete video
      description: Channel owner, moderator, or admin can delete a video. File deletion may be performed asynchronously.
      operationId: deleteVideo
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '204':
          description: Video deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /videos/{videoId}/confirm:
    post:
      tags: [Videos]
      summary: Confirm uploaded video and publish it
      operationId: confirmVideoUpload
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '204':
          description: Video confirmed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /videos/{videoId}/stream-url:
    get:
      tags: [Videos]
      security: []
      summary: Get video streaming URL
      operationId: getVideoStreamUrl
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Presigned URL for the original video file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Video is not ready yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /videos/{videoId}/views:
    post:
      tags: [Videos]
      summary: Record a video view
      operationId: recordVideoView
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '204':
          description: View recorded.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /videos/{videoId}/rating:
    put:
      tags: [Videos]
      summary: Replace current user's video rating
      operationId: rateVideo
      parameters:
        - $ref: '#/components/parameters/VideoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '204':
          description: Rating applied.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /videos/{videoId}/stats:
    get:
      tags: [Videos]
      security: []
      summary: Get video stats
      operationId: getVideoStats
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Video stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoStats'
        '404':
          $ref: '#/components/responses/NotFound'
  /videos/{videoId}/comments:
    get:
      tags: [Comments]
      security: []
      summary: List video comments
      operationId: listVideoComments
      parameters:
        - $ref: '#/components/parameters/VideoId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Comments page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Comments]
      summary: Create video comment
      operationId: createVideoComment
      parameters:
        - $ref: '#/components/parameters/VideoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentRequest'
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /comments/{commentId}:
    get:
      tags: [Comments]
      security: []
      summary: Get comment
      operationId: getComment
      parameters:
        - $ref: '#/components/parameters/CommentId'
      responses:
        '200':
          description: Comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Comments]
      summary: Update comment
      operationId: updateComment
      parameters:
        - $ref: '#/components/parameters/CommentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentRequest'
      responses:
        '200':
          description: Comment updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Comments]
      summary: Delete comment
      description: Comment author, moderator, or admin can delete a comment.
      operationId: deleteComment
      parameters:
        - $ref: '#/components/parameters/CommentId'
      responses:
        '204':
          description: Comment deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /comments/{commentId}/rating:
    put:
      tags: [Comments]
      summary: Replace current user's comment rating
      operationId: rateComment
      parameters:
        - $ref: '#/components/parameters/CommentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '204':
          description: Rating applied.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /comments/{commentId}/stats:
    get:
      tags: [Comments]
      security: []
      summary: Get comment rating stats
      operationId: getCommentStats
      parameters:
        - $ref: '#/components/parameters/CommentId'
      responses:
        '200':
          description: Comment stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingStats'
        '404':
          $ref: '#/components/responses/NotFound'
  /channels/{channelId}/playlists:
    get:
      tags: [Playlists]
      security: []
      summary: List channel playlists
      operationId: listChannelPlaylists
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Playlists page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistPage'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Playlists]
      summary: Create playlist in channel
      operationId: createPlaylist
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistCreateRequest'
      responses:
        '201':
          description: Playlist created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/me/playlists:
    get:
      tags: [Playlists]
      summary: List current user's playlists
      operationId: listMyPlaylists
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Playlists page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /playlists/{playlistId}:
    get:
      tags: [Playlists]
      security: []
      summary: Get playlist
      operationId: getPlaylist
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      responses:
        '200':
          description: Playlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Playlists]
      summary: Update playlist
      operationId: updatePlaylist
      parameters:
