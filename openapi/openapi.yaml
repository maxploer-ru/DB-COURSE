        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    VideoId:
      name: videoId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CommunityCommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: Request validation or domain rule failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidUsername:
              summary: Invalid username
              value:
                error:
                  code: INVALID_USERNAME
                  message: The username is invalid
            invalidUserEmail:
              summary: Invalid email
              value:
                error:
                  code: INVALID_USER_EMAIL
                  message: The email is invalid
            weakPassword:
              summary: Weak password
              value:
                error:
                  code: WEAK_PASSWORD
                  message: The password is too weak
            playlistNameEmpty:
              summary: Empty playlist name
              value:
                error:
                  code: PLAYLIST_NAME_EMPTY
                  message: Playlist name cannot be empty
            playlistVideoChannelMismatch:
              summary: Playlist and video belong to different channels
              value:
                error:
                  code: PLAYLIST_VIDEO_CHANNEL_MISMATCH
                  message: Video belongs to another channel
            selfSubscription:
              summary: User cannot subscribe to own channel
              value:
                error:
                  code: SELF_SUBSCRIPTION
                  message: Cannot subscribe to your own channel
            invalidNotificationSettings:
              summary: Invalid notification settings
              value:
                error:
                  code: INVALID_NOTIFICATION_SETTINGS
                  message: Notification settings payload is invalid
            roleNotFound:
              summary: Role not found
              value:
                error:
                  code: ROLE_NOT_FOUND
                  message: Role not found
            communityPostContentEmpty:
              summary: Empty community post
              value:
                error:
                  code: COMMUNITY_POST_CONTENT_EMPTY
                  message: Community post content cannot be empty
            communityCommentContentEmpty:
              summary: Empty community comment
              value:
                error:
                  code: COMMUNITY_COMMENT_CONTENT_EMPTY
                  message: Community comment content cannot be empty
    Unauthorized:
      description: Authentication failed or token is missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidCredentials:
              summary: Invalid login credentials
              value:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password
            invalidToken:
              summary: Invalid or expired token
              value:
                error:
                  code: INVALID_TOKEN
                  message: Invalid or expired token
            missingAuthorization:
              summary: Missing bearer token
              value:
                error:
                  code: UNAUTHORIZED
                  message: user not authorized
    Forbidden:
      description: Authenticated user is not allowed to perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              summary: Insufficient permissions
              value:
                error:
                  code: FORBIDDEN
                  message: You don't have permission to access this resource
            userBanned:
              summary: User account is banned
              value:
                error:
                  code: USER_BANNED
                  message: User account is banned
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            userNotFound:
              summary: User not found
              value:
                error:
                  code: USER_NOT_FOUND
                  message: User not found
            channelNotFound:
              summary: Channel not found
              value:
                error:
                  code: CHANNEL_NOT_FOUND
                  message: Channel not found
            videoNotFound:
              summary: Video not found
              value:
                error:
                  code: VIDEO_NOT_FOUND
                  message: Video not found
            playlistNotFound:
              summary: Playlist not found
              value:
                error:
                  code: PLAYLIST_NOT_FOUND
                  message: Playlist not found
            ratingNotFound:
              summary: Rating not found
              value:
                error:
                  code: RATING_NOT_FOUND
                  message: Rating not found
            commentNotFound:
              summary: Comment not found
              value:
                error:
                  code: COMMENT_NOT_FOUND
                  message: Comment not found
            communityPostNotFound:
              summary: Community post not found
              value:
                error:
                  code: COMMUNITY_POST_NOT_FOUND
                  message: Community post not found
            communityCommentNotFound:
              summary: Community comment not found
              value:
                error:
                  code: COMMUNITY_COMMENT_NOT_FOUND
                  message: Community comment not found
    Conflict:
      description: Resource state conflicts with the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            usernameTaken:
              summary: Username already exists
              value:
                error:
                  code: USERNAME_TAKEN
                  message: Username already taken
            emailTaken:
              summary: Email already exists
              value:
                error:
                  code: EMAIL_TAKEN
                  message: Email already registered
            channelAlreadyExists:
              summary: User already has a channel
              value:
                error:
                  code: CHANNEL_ALREADY_EXISTS
                  message: Channel already exists
            channelNameTaken:
              summary: Channel name already exists
              value:
                error:
                  code: CHANNEL_NAME_TAKEN
                  message: Channel name already exists
            alreadyRated:
              summary: Resource has already been rated
              value:
                error:
                  code: ALREADY_RATED
                  message: This video has already been rated
            videoNotReady:
              summary: Video is not ready
              value:
                error:
                  code: VIDEO_NOT_READY
                  message: Video is not ready yet
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internalError:
              summary: Unexpected server error
              value:
                error:
                  code: INTERNAL_ERROR
                  message: Something went wrong
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: ERROR_CODE
        message:
          type: string
          example: Human-readable error message
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    AuthResponse:
      type: object
      required: [user, accessToken, refreshToken, refreshExpiresAt]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
    Role:
      type: object
      required: [id, name, isDefault]
      properties:
        id:
          type: integer
        name:
          $ref: '#/components/schemas/RoleName'
        isDefault:
          type: boolean
    RoleName:
      type: string
      enum: [admin, moderator, user]
    User:
      type: object
      required: [id, username, email, isActive, notificationsEnabled, createdAt, updatedAt]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        isActive:
          type: boolean
        notificationsEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        role:
          $ref: '#/components/schemas/Role'
    NotificationSettingsRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    ChangeUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/RoleName'
    Channel:
      type: object
      required: [id, userId, ownerUsername, name, description, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        ownerUsername:
          type: string
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    ChannelCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          default: ''
    ChannelUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        description:
          type: string
    Subscription:
      type: object
      required: [userId, channelId, channelName, newVideosCount, subscribedAt]
      properties:
        userId:
          type: integer
        channelId:
          type: integer
        channelName:
          type: string
        newVideosCount:
          type: integer
          minimum: 0
        subscribedAt:
          type: string
          format: date-time
    SubscriptionStatus:
      type: object
      required: [subscribed]
      properties:
        subscribed:
          type: boolean
    CountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 0
    VideoStatus:
      type: string
      enum: [pending, ready]
    Video:
      type: object
      required: [id, channelId, channelName, title, description, filepath, originalFilename, status, createdAt]
      properties:
        id:
          type: integer
        channelId:
          type: integer
        channelName:
          type: string
        title:
          type: string
        description:
          type: string
        filepath:
          type: string
          description: Storage object key.
        originalFilename:
          type: string
        status:
          $ref: '#/components/schemas/VideoStatus'
        createdAt:
          type: string
          format: date-time
        stats:
          $ref: '#/components/schemas/VideoStats'
    VideoStats:
      type: object
      required: [views, likes, dislikes, comments]
      properties:
        views:
          type: integer
          minimum: 0
        likes:
          type: integer
          minimum: 0
        dislikes:
          type: integer
          minimum: 0
        comments:
          type: integer
          minimum: 0
    VideoUploadInitRequest:
      type: object
      required: [title, filename]
      properties:
        title:
          type: string
        description:
          type: string
          default: ''
        filename:
          type: string
          example: video.mp4
    VideoUploadInitResponse:
      type: object
      required: [video, uploadUrl, uploadExpiresAt]
      properties:
        video:
          $ref: '#/components/schemas/Video'
        uploadUrl:
          type: string
          format: uri
        uploadExpiresAt:
          type: string
          format: date-time
    VideoUpdateRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
        description:
          type: string
    PresignedUrlResponse:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    RatingAction:
      type: string
      enum: [like, dislike, remove]
    RatingRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/RatingAction'
    RatingStats:
      type: object
      required: [likes, dislikes]
      properties:
        likes:
          type: integer
          minimum: 0
        dislikes:
          type: integer
          minimum: 0
    Comment:
      type: object
      required: [id, userId, username, videoId, content, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: string
        videoId:
          type: integer
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    ContentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
    Playlist:
      type: object
      required: [id, channelId, name, description, createdAt]
      properties:
        id:
          type: integer
        channelId:
          type: integer
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    PlaylistCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          default: ''
    PlaylistUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        description:
          type: string
    AddPlaylistVideoRequest:
      type: object
      required: [videoId]
      properties:
        videoId:
          type: integer
          minimum: 1
    UpdatePlaylistVideoPositionRequest:
      type: object
      required: [position]
      properties:
        position:
          type: integer
          minimum: 1
    PlaylistItem:
      type: object
      required: [playlistId, videoId, number, addedAt, videoTitle, channelName, videoStatus]
      properties:
        playlistId:
          type: integer
        videoId:
          type: integer
        number:
          type: integer
          minimum: 1
        addedAt:
          type: string
          format: date-time
        videoTitle:
          type: string
        channelName:
          type: string
        videoStatus:
          $ref: '#/components/schemas/VideoStatus'
    Community:
      type: object
      required: [channel, posts, totalCount, limit, offset]
      properties:
        channel:
          $ref: '#/components/schemas/Channel'
        posts:
          type: array
          items:
            $ref: '#/components/schemas/CommunityPost'
        totalCount:
          type: integer
          format: int64
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer
    CommunityPost:
      type: object
      required: [id, channelId, userId, username, content, createdAt]
      properties:
        id:
          type: integer
        channelId:
          type: integer
        userId:
          type: integer
        username:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    CommunityComment:
      type: object
      required: [id, postId, userId, username, content, createdAt]
      properties:
        id:
          type: integer
        postId:
          type: integer
        userId:
          type: integer
        username:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    PageMeta:
      type: object
      required: [limit, offset, totalCount]
      properties:
        limit:
          type: integer
        offset:
          type: integer
        totalCount:
          type: integer
          format: int64
          minimum: 0
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/User'
    ChannelPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
